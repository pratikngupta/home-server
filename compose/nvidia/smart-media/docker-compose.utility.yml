######################################################
#
# Helper
#
# Services: Tautili, Kometa, Recycler
#
######################################################

services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=1000
      - PGID=1000
    env_file: .env
    volumes:
      - ${DATA_DIR}/media-server/tautulli/config:/config
      # timezone
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth Bypass
      - "traefik.http.routers.tautulli-rtr-bypass.entrypoints=https"
      - "traefik.http.routers.tautulli-rtr-bypass.rule=Host(`tautulli.$DOMAIN`) && Header(`traefik-auth-bypass-key`, `$TRAEFIK_AUTH_BYPASS_KEY`)" # Bypass Auth for LunaSea on iOS
      - "traefik.http.routers.tautulli-rtr-bypass.priority=100"
      ## HTTP Routers Auth
      - "traefik.http.routers.tautulli-rtr.entrypoints=https"
      - "traefik.http.routers.tautulli-rtr.rule=Host(`tautulli.$DOMAIN`)"
      - "traefik.http.routers.tautulli-rtr.priority=99"
      ## Enable tls
      - "traefik.http.routers.tautulli-rtr.tls=true"
      - "traefik.http.routers.tautulli-rtr-bypass.tls=true"
      ## Middleware
      - "traefik.http.routers.tautulli-rtr-bypass.middlewares=chain-no-auth@file"
      - "traefik.http.routers.tautulli-rtr.middlewares=chain-tinyauth-oauth@file"
      ## HTTP Services
      - "traefik.http.routers.tautulli-rtr.service=tautulli-svc"
      - "traefik.http.routers.tautulli-rtr-bypass.service=tautulli-svc"
      - "traefik.http.services.tautulli-svc.loadbalancer.server.port=8181"
      - "dev.dozzle.group=Smart Media"
    #depends_on:
    #mount-check:
    #condition: service_healthy

  notifiarr:
    container_name: notifiarr
    hostname: notifiarr
    image: golift/notifiarr
    restart: unless-stopped
    privileged: true # Enables privileged mode
    env_file: .env
    # environment:
    #   # - DN_SNAPSHOT_NVIDIA_SMI_PATH=/usr/bin/nvidia-smi
    networks:
      - traefik_network
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities:
    #             - gpu
    # ports:
    #   - "5454:5454"
    volumes:
      - ${DATA_DIR}/media-server/notifiarr:/config
      - /var/run/utmp:/var/run/utmp
      - /etc/machine-id:/etc/machine-id
      - /mnt/movie:/movie
      # - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:rw

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifiarr.rule=Host(`notifiarr.${DOMAIN}`)"
      - "traefik.http.routers.notifiarr.entrypoints=https"
      - "traefik.http.routers.notifiarr.tls=true"
      ## Middlewares
      # - "traefik.http.routers.notifiarr.middlewares=chain-tinyauth-oauth@file"
      - "traefik.http.routers.notifiarr.middlewares=chain-no-auth@file"
    #depends_on:
    #mount-check:
    #condition: service_healthy

  jellystat-db:
    image: postgres:15.14
    shm_size: "1gb"
    container_name: jellystat-db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file: .env
    networks:
      - jellystat_network
    volumes:
      - ${DATA_DIR}/media-server/jellystat/db:/var/lib/postgresql/data

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    env_file: .env
    environment:
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      TZ: america/toronto
    volumes:
      - ${DATA_DIR}/media-server/jellystat/backup-data:/app/backend/backup-data
    depends_on:
      - jellystat-db
    networks:
      - jellystat_network
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellystat.rule=Host(`jellystat.${DOMAIN}`)"
      - "traefik.http.routers.jellystat.entrypoints=https"
      - "traefik.http.routers.jellystat.tls=true"
      ## Middlewares
      - "traefik.http.routers.jellystat.middlewares=chain-tinyauth-oauth@file"
      # use traefik_network as multiple networks are not supported
      - "traefik.docker.network=traefik_network"
      - "dev.dozzle.group=Smart Media"

networks:
  jellystat_network:
    driver: bridge
  traefik_network:
    external: true
